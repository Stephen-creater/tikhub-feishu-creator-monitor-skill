[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creator-monitor"
version = "0.2.0"
description = "Codex Skill for TikHub and Feishu creator monitoring"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Stephen-creater" }]
dependencies = [
  "pydantic>=2.9,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "pyyaml>=6,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
creator-monitor = "creator_monitor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/creator_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
